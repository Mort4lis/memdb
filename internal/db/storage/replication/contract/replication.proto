syntax = "proto3";

package schema.v1;

option go_package = "github.com/Mort4lis/memdb/internal/db/storage/replication/contract";

enum ErrorCode {
  UNKNOWN = 0;
  INTERNAL = 1;
  NOT_FOUND = 2;
}

message Error {
  ErrorCode code = 1;
  string text = 2;
}

message NextSegmentRequest {
  string request_id = 1;
  string last_segment_name = 2;
}

message NextSegmentResponse {
  Error error = 1;
  string segment_name = 2;
  bytes data = 3;
}